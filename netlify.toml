# ÄGE veebipoe Netlify seadistus.
# Sait on puhas HTML/CSS/JS — ehitus-käsku pole vaja. Netlify paigaldab siiski
# package.json sõltuvused (nt "stripe"), mida serverifunktsioonid kasutavad.
# Avalikud failid on kaustas public/ — ainult see läheb internetti. Juhend, testid,
# skriptid, node_modules ja seadistused jäävad avalikkuse eest peitu.

[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Node 20 elutsükkel lõppes 2026. aasta aprillis, seega kasutame Node 22 LTS-i.
  NODE_VERSION = "22"
  # Playwright on ainult kohalikuks testimiseks — brausereid Netlifys alla ei laadita.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  node_bundler = "esbuild"

# Funktsioonide aadressid on määratud funktsioonifailides endis
# (`export const config = { path: '/api/…' }`), et kood ja aadress oleksid koos:
#   /api/checkout        create-checkout.mjs  — tellimus andmebaasi + Stripe'i makseleht
#   /api/stripe-webhook  stripe-webhook.mjs   — Stripe'i sündmused (makstud/aegunud/tagasimakse)
#   /api/tellimus        order-status.mjs     — kinnituslehe (/aitah) andmed tellimuse tunnusega
#   /api/pakiautomaadid  parcel-lockers.mjs   — Omniva/SmartPosti/DPD automaadid (puhver andmebaasis)
#   /api/taganemine      withdrawal.mjs       — taganemisavaldus veebivormist
#   (ajastatud)          lockers-refresh.mjs  — värskendab automaatide nimekirja kord ööpäevas
#                                               (`config.schedule = '@daily'` failis endas)
#   /__mock-stripe/*     dev-mock-stripe.mjs  — AINULT kohalik test-Stripe; Netlifys vastab alati 404
#   /admin, /api/admin/* admin*.mjs           — halduspaneel (serveerib funktsioon, mitte staatiline fail)
# Kiiruspiirangud (rateLimit) on samuti funktsioonide config-is.
# Lehekülje puudumisel näitab Netlify automaatselt faili public/404.html.
# "Ilusad" aadressid töötavad vaikimisi: /mida-viiu → mida-viiu.html.
# NB! Ära lisa kausta public/ faili admin.html ega kausta admin/ — /admin peab jääma funktsioonile.

# --- Turvapäised kõigile vastustele ------------------------------------------
# CSP: skriptid ainult oma domeenilt (inline-skripte EI tohi kasutada;
# <script type="application/ld+json"> on lubatud, sest seda ei käivitata).
# Stilid: oma domeen + Google Fonts; inline style-atribuudid on lubatud.
# Kaadrid: ainult Pacdora 3D-vaade. Makse toimub Stripe'i lehel (suunamine).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.pacdora.com https://pacdora.com https://*.pacdora.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests"

# Kinnitusleht: aadressis on tellimuse salajane tunnus (?t=…). Ära saada seda
# Referer-päisega kuhugi edasi ja ära lase otsingumootoritel lehte indekseerida.
# (Funktsioonide vastustele seab samad päised kood ise.)
[[headers]]
  for = "/aitah"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/aitah.html"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"

# --- Puhverdamine ------------------------------------------------------------
# Pildid muutuvad harva: brauser hoiab neid nädal. Kui vahetad pildi, anna
# uuele failile uus nimi (nt mida-viiu-box-front-v2.webp), et kõik näeksid kohe uut.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# CSS ja JS failinimedes pole versiooni-räsi ning JS-moodulid impordivad üksteist.
# Kui brauser hoiaks neid tund aega, võiks pärast uut deploy'd segi minna vana ja
# uus versioon (leht katki). Seepärast: alati kontrolli üle — Netlify vastab
# muutmata failile kiire "304 Not Modified"-iga ja CDN serveerib neid niikuinii lähedalt.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
